{% extends "base.html" %}
{% load static %}
{% block content %}
    <main class="home-page">
        <div class="hero">
            <div class="hero-content">
                <h2>Welcome to Movie Review <br> 
                    <span class="username">
                        {% if request.user.is_authenticated %}
                            {{ request.user.username }}
                        {% else %}
                            Guest
                        {% endif %}
                    </span>
                </h2>
                <p class="hero-subtitle">Where movies meet critique</p>
                <div class="hero-btns">
                    <a href="{% url 'movies' %}" class="btn-primary">Explore Movies</a>
                    <a href="#" class="btn-secondary">Learn More</a>
                </div>
            </div>
            <!-- This creates the atmospheric background glow -->
            <div class="hero-overlay"></div>
        </div>
    </main>
{% endblock %}
