{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review | Discover Cinema</title>
    <!-- Added Google Fonts for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FIXED: Added rel="stylesheet" -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}"/>
</head>
<body>
    <header class="main-header">
        <nav class="navbar">
            <a href="{% url 'home' %}" class="logo">
                <span class="logo-icon">🎬</span> Movie<span>Review</span>
            </a>
            
            <div class="navigations">
                <ul>
                    <li><a href="{% url 'movies' %}" class="nav-link">Movies</a></li>
                    {% if request.user.is_authenticated %}
                        <li><a href="{% url 'logout' %}" class="nav-btn btn-logout">Logout</a></li>
                    {% else %}
                        <li><a href="{% url 'login' %}" class="nav-btn btn-login">Login</a></li>
                    {% endif %}
                </ul>
            </div>
        </nav>
    </header>

    <main class="content-wrapper">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="main-footer">
        <p>&copy; 2023 MovieReview. All rights reserved.</p>
    </footer>
</body>
</html>
